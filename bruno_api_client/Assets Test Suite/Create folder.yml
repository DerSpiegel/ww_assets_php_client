info:
  name: Create folder
  type: http
  seq: 3

http:
  method: POST
  url: "{{assetsUrl}}/api/folder"
  body:
    type: json
    data: |-
      {
        "path": "{{tempTestFolder}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("tempTestFolderId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body
      operator: isJson
    - expression: res.body.id
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
