info:
  name: Search asset
  type: http
  seq: 5

http:
  method: POST
  url: "{{assetsUrl}}/services/search"
  body:
    type: multipart-form
    data:
      - name: q
        type: text
        value: id:{{tempTestAssetId}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.totalHits
      operator: eq
      value: "1"
    - expression: res.body.hits[0].metadata.folderPath
      operator: eq
      value: "{{tempTestFolder}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "WoodWing Helpcenter: [Assets Server REST API - create](https://helpcenter.woodwing.com/hc/en-us/articles/360042268771-Assets-Server-REST-API-create)"
