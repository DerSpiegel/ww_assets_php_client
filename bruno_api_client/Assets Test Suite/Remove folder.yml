info:
  name: Remove folder
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{assetsUrl}}/api/folder/:id"
  params:
    - name: id
      value: "{{tempTestFolderId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
