info:
  name: Remove asset
  type: http
  seq: 10

http:
  method: POST
  url: "{{assetsUrl}}/services/remove"
  body:
    type: multipart-form
    data:
      - name: ids
        type: text
        value: "{{tempTestAssetId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.processedCount
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "WoodWing Helpcenter: [Assets Server REST API - remove](https://helpcenter.woodwing.com/hc/en-us/articles/360041851352-Assets-Server-REST-API-remove)"
