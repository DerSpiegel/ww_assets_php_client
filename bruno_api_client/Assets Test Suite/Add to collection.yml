info:
  name: Add to collection
  type: http
  seq: 7

http:
  method: POST
  url: "{{assetsUrl}}/services/createRelation"
  body:
    type: multipart-form
    data:
      - name: relationType
        type: text
        value: contains
      - name: target1Id
        type: text
        value: "{{tempTestCollectionId}}"
      - name: target2Id
        type: text
        value: "{{tempTestAssetId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "WoodWing Helpcenter: [Assets Server REST API - create relation](https://helpcenter.woodwing.com/hc/en-us/articles/360042268751-Assets-Server-REST-API-create-relation)"
