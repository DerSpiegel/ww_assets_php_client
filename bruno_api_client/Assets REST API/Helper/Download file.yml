info:
  name: download file
  type: http
  seq: 2

http:
  method: GET
  url: "{{assetsUrl}}/file/:assetId/*/:filename?_=&forceDownload=true"
  params:
    - name: _
      value: ""
      type: query
    - name: forceDownload
      value: "true"
      type: query
    - name: assetId
      value: ""
      type: path
    - name: filename
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
