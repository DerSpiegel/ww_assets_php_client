info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{assetsUrl}}/services/login"
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: "{{assetsUsername}}"
      - name: password
        type: text
        value: "{{assetsPassword}}"
      - name: cred
        type: text
        value: ""
        disabled: true
      - name: clientType
        type: text
        value: ""
        disabled: true
      - name: returnProfile
        type: text
        value: ""
        disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "WoodWing Helpcenter: [Assets Server REST API - login](https://helpcenter.woodwing.com/hc/en-us/articles/360042268831-Assets-Server-REST-API-login)"
